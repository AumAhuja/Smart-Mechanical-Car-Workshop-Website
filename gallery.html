<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo">
                <div class="logo"></div>
            </div>

            <div class="nav-services border">
                <div class="text"><a href="show_services.html">Services</a></div>
                <div class="add-icon">
                    <i class="fa-solid fa-taxi"></i>
                </div>
            </div>

            <div class="nav-mechanics border">
                <div class="text"><a href="mechanics.html">Mechanics</a></div>
                <div class="add-icon">
                    <i class="fa-solid fa-wrench"></i>
                </div>
            </div>

            <div class="nav-gallery border">
                <div class="text"><a href="gallery.html">Gallery</a></div>
                <div class="add-icon">
                    <i class="fa-regular fa-images"></i>
                </div>
            </div>

            <div class="nav-booking border">
                <div class="text"><a href="book_services.html">Book Your Service</a></div>
                <div class="add-icon">
                    <i class="fa-solid fa-phone-volume"></i>
                </div>
            </div>

            <div class="nav-contact border">
                <div class="text"><a href="contact.html">Contact Us</a></div>
                <div class="add-icon">
                    <i class="fa-solid fa-id-card"></i>
                </div>
            </div>
        </div>
    </header>

    <section>
        <h1 class="g-heading">Our Workshop Gallery</h1>
        <hr id="below-ghead">

        <div class="gallery-tabs">
            <span class="tab active">Workshop</span>
            <span class="tab">Services</span>
            <span class="tab">Before / After</span>
        </div>

        <div class="gallery-grid">
            <div class="gallery-item"><img src="engine-repair-before.png" alt=""></div>
            <div class="gallery-item"><img src="before-brake.png" alt=""></div>
            <div class="gallery-item"><img src="before-car-suspension.png" alt=""></div>
            <div class="gallery-item"><img src="after-repair-engine.png" alt=""></div>
            <div class="gallery-item"><img src="after-brake.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-1.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-12.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-3.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_1.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_2.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_4.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_6.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_3.png" alt=""></div>
            <div class="gallery-item"><img src="show_services_5.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-7.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-6.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-5.png" alt=""></div>
            <div class="gallery-item"><img src="mechanic-4.png" alt=""></div>
        </div>
    </section>

    <footer>
        <div class="copyright">
            <p>© 2026 <span>Smart Mechanical Workshop</span> | All Rights Reserved</p>
        </div>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script src="gallery_page.js"></script>

</body>
</html>
